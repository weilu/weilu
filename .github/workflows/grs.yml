name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=weilu&theme=shadow_blue&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GH_README_STATS_TOKEN }}

      # github-readme-stats writes an error card (still exit 0) when auth/API fails.
      # Fail here so a bad run never overwrites a good card with "Something went wrong!".
      - name: Verify card is not an error
        run: |
          if grep -q "Something went wrong" profile/stats.svg; then
            echo "::error::Stats card generation failed:"
            grep -o 'data-testid="message".*' profile/stats.svg || cat profile/stats.svg
            exit 1
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
